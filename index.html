<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Best Card">
<title>Which card do I swipe?</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0b0b12">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap');
* { box-sizing:border-box; }
html,body { margin:0; background:#0b0b12; }
body { font-family:'Space Grotesk',system-ui,sans-serif; color:#EDEBE4; }
.mono { font-family:'JetBrains Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }
.wrap { max-width:640px; margin:0 auto; padding:22px 18px 34px; min-height:100vh; }
h1 { margin:4px 0 0; font-size:27px; font-weight:700; letter-spacing:-.5px; }
.eyebrow { font-size:12px; letter-spacing:3px; color:#E8B04B; font-weight:600; }
.set { background:transparent; border:1px solid #2c2c40; color:#B7B5C4; border-radius:9px;
  padding:7px 12px; cursor:pointer; font-family:inherit; font-size:13px; font-weight:500; }
.set:hover { border-color:#4a4a66; color:#EDEBE4; }
.panel { background:#14141f; border:1px solid #26263a; border-radius:12px; padding:16px; margin:14px 0 4px;
  display:flex; flex-direction:column; gap:18px; }
.ptitle { font-weight:600; font-size:14px; margin-bottom:3px; }
.note { font-size:12.5px; color:#8b8aa0; line-height:1.5; }
.seg { display:inline-flex; border:1px solid #2c2c40; border-radius:9px; overflow:hidden; }
.seg button { background:#191926; border:none; color:#8b8aa0; padding:8px 14px; cursor:pointer;
  font-family:inherit; font-size:13px; font-weight:600; }
.seg button[data-on="1"] { background:#E8B04B; color:#1a1408; }
.in { background:#0f0f18; border:1px solid #2c2c40; color:#EDEBE4; border-radius:8px; padding:8px 10px;
  font-family:'JetBrains Mono',monospace; width:90px; font-size:14px; }
input[type=range] { width:100%; accent-color:#E8B04B; }
.chip { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:9px; margin:16px 0 18px; }
.cat { text-align:left; cursor:pointer; background:#181824; border:1px solid #262636; border-radius:11px;
  padding:11px 12px; color:#B7B5C4; transition:transform .12s, border-color .12s, background .12s;
  display:flex; flex-direction:column; gap:7px; }
.cat:hover { border-color:#3a3a52; background:#1d1d2c; transform:translateY(-1px); }
.cat:focus-visible { outline:2px solid #E8B04B; outline-offset:2px; }
.cat[data-on="1"] { border-color:#E8B04B; background:#20202f; color:#EDEBE4; box-shadow:0 0 0 1px #E8B04B inset; }
.cat .ic { color:#7d7b93; } .cat[data-on="1"] .ic { color:#E8B04B; }
.lab { font-weight:600; font-size:14px; letter-spacing:.2px; }
.sub { font-size:11px; color:#6f6d82; line-height:1.3; }
.card { position:relative; border-radius:14px; padding:18px 20px; overflow:hidden; background:#1a1a28;
  box-shadow:0 0 0 1px #E8B04B, 0 14px 40px -12px rgba(232,176,75,.4); }
.card .glow { position:absolute; inset:0; background:radial-gradient(120% 100% at 100% 0%, rgba(232,176,75,.16), transparent 60%); }
.cchip { width:30px; height:22px; border-radius:5px; background:linear-gradient(135deg,#E8B04B,#b9832d); }
.cimg { height:40px; width:auto; border-radius:6px; display:block; box-shadow:0 2px 9px rgba(0,0,0,.45); }
.cfallback { width:63px; height:40px; border-radius:6px; background:#CC0000; color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 9px rgba(0,0,0,.45); }
.cfallback svg { width:26px; height:26px; }
.runner { display:flex; align-items:center; gap:12px; padding:11px 13px; border-radius:10px;
  background:#16161e; border:1px solid #23232f; }
.stripe { width:4px; align-self:stretch; border-radius:3px; min-height:26px; }
.notebox { background:#14141f; border:1px solid #23232f; border-radius:11px; padding:13px 15px; }
.empty { text-align:center; color:#6f6d82; padding:26px 0; font-size:14px; }
.foot { margin-top:22px; font-size:11px; color:#55536a; line-height:1.5; }
.warn { background:#2a1810; border:1px solid #7a4a1e; border-radius:11px; padding:12px 14px; margin:14px 0 2px;
  font-size:12.5px; line-height:1.5; color:#f0c891; display:flex; gap:9px; }
.warn b { color:#E8B04B; }
.trk { background:#14141f; border:1px solid #26263a; border-radius:12px; padding:13px 15px; }
.trk.in-card { position:relative; background:transparent; border:none; border-top:1px solid #3a3322; border-radius:0; padding:14px 0 0; margin-top:14px; }
.trk-top { display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; }
.trk-lab { font-size:11px; letter-spacing:2px; color:#9c9ab0; font-weight:600; }
.trk-amt { font-size:15px; font-weight:700; }
.trk-bar { height:9px; border-radius:6px; background:#23232f; overflow:hidden; margin:9px 0 7px; }
.trk-fill { height:100%; border-radius:6px; background:#E8B04B; transition:width .25s; }
.trk-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:10px; }
.trk .in { width:110px; }
.trk-link { background:none; border:none; color:#8b8aa0; font-family:inherit; font-size:12px; cursor:pointer; text-decoration:underline; padding:0; }
@media (prefers-reduced-motion:reduce){ .trk-fill{ transition:none; } }
@media (max-width:520px){ .wrap{ padding:16px 14px 30px; } .chip{ grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); } }
@media (prefers-reduced-motion:reduce){ .cat{ transition:none; } }
</style>
</head>

// ---- Freedom Flex rotating 5% categories, by quarter ------------------------
// To add a quarter: copy a block, set the dates, and map each 5% category to
// one of the CATS keys (gas / transit / entertainment / groceries / dining /
// online / general, etc.). Chase usually announces ~2-3 weeks before quarter
// start. Verify at chase.com/freedomflex before publishing.
const QUARTERS = [
  { id:'2026Q3', label:'3rd Quarter 2026', start:'2026-07-01', end:'2026-09-30',
    ffBonus:{ gas:5, transit:5, entertainment:5 },
    blurb:'5% on gas &amp; EV charging, transit, live entertainment' },
  // Q4 2026: grocery stores 5%; dining elevated to 7% for Freedom Flex.
  { id:'2026Q4', label:'4th Quarter 2026', start:'2026-10-01', end:'2026-12-31',
    ffBonus:{ groceries:5, dining:7 },
    blurb:'5% at grocery stores, 7% on dining' },
];

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function currentQuarter(){
  const t = todayStr();
  return QUARTERS.find(q => t >= q.start && t <= q.end) || null;
}
// Overlay the active quarter's 5% onto a category's Freedom Flex rate.
// ---- Freedom Flex bonus-spend tracker ----------------------------------------
// Tracks spend toward the quarterly bonus cap, per quarter (resets automatically
// when a new quarter starts). Manual entry for now, saved on this device only.
// FUTURE FEED: set SPEND_FEED_URL to a JSON file shaped like
//   { "2026Q4": 432.10, "updated": "2026-10-14" }
// and the tracker will read from it instead of manual entry.
const FF_CAP_DEFAULT = 1500;
const SPEND_FEED_URL = null;   // e.g. './ff-spend.json'
let SPEND = {}, feedSpend = null, feedUpdated = null, trkEditing = false;
try { SPEND = JSON.parse(localStorage.getItem('bestcard:ffspend') || '{}') || {}; } catch(e){ SPEND = {}; }
function saveSpend(){ try { localStorage.setItem('bestcard:ffspend', JSON.stringify(SPEND)); } catch(e){} }
function ffCap(q){ return (q && q.cap) || FF_CAP_DEFAULT; }
function ffSpent(q){
  if(!q) return 0;
  if(feedSpend && feedSpend[q.id]!==undefined) return +feedSpend[q.id] || 0;
  return +SPEND[q.id] || 0;
}
function ffCapHit(q){ return q ? ffSpent(q) >= ffCap(q) : false; }
function loadSpendFeed(){
  if(!SPEND_FEED_URL) return;
  fetch(SPEND_FEED_URL, { cache:'no-store' }).then(r => r.ok ? r.json() : null).then(j => {
    if(!j) return; feedSpend = j; feedUpdated = j.updated || null; renderAll();
  }).catch(()=>{});
}
const money = n => '$' + Math.round(n).toLocaleString('en-US');

function withQuarter(cat){
  const q = currentQuarter();
  const bonus = (q && !ffCapHit(q)) ? (q.ffBonus[cat.key] || 0) : 0;
  if(!bonus) return cat;
  return Object.assign({}, cat, { rates: Object.assign({}, cat.rates, { ff: Math.max(cat.rates.ff||1, bonus) }) });
}

const DEFAULTS = { bofaBoost:0.75, ucrIntroActive:false, ucrIntroRate:2.625, chaseCpp:1.0 };
let S = Object.assign({}, DEFAULTS);
let sel = null, showSettings = false;

try { const raw = localStorage.getItem('bestcard:settings'); if(raw) S = Object.assign({}, DEFAULTS, JSON.parse(raw)); } catch(e){}
function save(){ try { localStorage.setItem('bestcard:settings', JSON.stringify(S)); } catch(e){} }

const fmt = n => n.toFixed(3).replace(/0+$/,'').replace(/\.$/,'');

function effective(k, cat){
  const c = CARDS[k];
  if(c.type==='chase')  return (cat.rates[k]||1) * S.chaseCpp;
  if(c.type==='ccr')    return (cat.rates.ccr||1) * (1 + S.bofaBoost);
  if(c.type==='ucr')    return S.ucrIntroActive ? S.ucrIntroRate : 1.5 * (1 + S.bofaBoost);
  if(c.type==='target') return cat.rates.target;
  if(c.type==='paypal') return cat.rates.paypal || 0;
  return cat.rates.amex || 1;
}
function ranking(cat){
  const keys = Object.keys(CARDS)
    .filter(k => LISTED_ONLY.includes(k) ? cat.rates[k]!==undefined : true)
    .filter(k => cat.accepts ? cat.accepts.includes(k) : true);
  const rows = keys.map(k => ({ key:k, rate: effective(k, cat) }));
  const pr = cat.travel ? { csp:2, ff:1 } : (cat.prefer || {});
  rows.sort((a,b)=> (b.rate - a.rate) || ((pr[b.key]||0) - (pr[a.key]||0)));
  const top = rows[0].rate;
  rows.forEach(r => r.tie = (top - r.rate) < 0.05);
  // Travel: Sapphire's protections break a tie with Freedom Flex, so Freedom isn't a co-winner.
  if(cat.travel && rows[0].key==='csp') rows.forEach(r => { if(r.key==='ff') r.tie=false; });
  return rows;
}

const icon = k => '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="display:block">'+ICONS[k]+'</svg>';

function renderSettings(){
  const el = document.getElementById('settings');
  const badge = 'BofA '+Math.round(S.bofaBoost*100)+'%'+(S.ucrIntroActive?' · intro '+fmt(S.ucrIntroRate)+'%':'')+(S.chaseCpp>1?' · '+fmt(S.chaseCpp)+'¢/pt':'');
  document.getElementById('setBtn').textContent = (showSettings?'Done':'Settings')+' · '+badge;
  if(!showSettings){ el.innerHTML=''; return; }
  el.innerHTML = `
    <div class="panel">
      <div>
        <div class="ptitle">BofA rewards boost</div>
        <div class="note" style="margin-bottom:8px">Pick 75% only if grandfathered from Platinum Honors (holds through Nov 2026). New Preferred Honors is 50%.</div>
        <div class="seg" id="segBoost">
          <button data-v="0.25" data-on="${S.bofaBoost===0.25?1:0}">25%</button>
          <button data-v="0.5"  data-on="${S.bofaBoost===0.5?1:0}">50%</button>
          <button data-v="0.75" data-on="${S.bofaBoost===0.75?1:0}">75%</button>
        </div>
      </div>
      <div>
        <div class="ptitle">UCR first-year intro rate</div>
        <div class="note" style="margin-bottom:8px">If your Unlimited Cash card has a bumped first-year rate, turn it on and enter the effective %.</div>
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <div class="seg" id="segIntro">
            <button data-v="off" data-on="${!S.ucrIntroActive?1:0}">Off</button>
            <button data-v="on"  data-on="${S.ucrIntroActive?1:0}">On</button>
          </div>
          <input class="in" id="introRate" type="number" step="0.1" value="${S.ucrIntroRate}" ${S.ucrIntroActive?'':'disabled'} style="opacity:${S.ucrIntroActive?1:.4}">
          <span class="note">% effective</span>
        </div>
      </div>
      <div>
        <div class="ptitle">Chase point value — ${fmt(S.chaseCpp)}¢/pt</div>
        <div class="note" style="margin-bottom:8px">1.0 = cash back / Pay Yourself Back. Raise it if you transfer Ultimate Rewards to travel partners via Sapphire.</div>
        <input id="cpp" type="range" min="1" max="2" step="0.05" value="${S.chaseCpp}">
      </div>
    </div>`;
  el.querySelectorAll('#segBoost button').forEach(b=>b.onclick=()=>{ S.bofaBoost=parseFloat(b.dataset.v); save(); renderAll(); });
  el.querySelectorAll('#segIntro button').forEach(b=>b.onclick=()=>{ S.ucrIntroActive=(b.dataset.v==='on'); save(); renderAll(); });
  const ir=document.getElementById('introRate'); if(ir) ir.oninput=()=>{ S.ucrIntroRate=parseFloat(ir.value)||0; save(); renderResult(); };
  const cpp=document.getElementById('cpp'); if(cpp) cpp.oninput=()=>{ S.chaseCpp=parseFloat(cpp.value); save(); renderSettings(); renderResult(); };
}

function renderChips(){
  const el = document.getElementById('chips');
  el.innerHTML = CATS.map(c=>`
    <button class="cat" data-k="${c.key}" data-on="${sel===c.key?1:0}" aria-pressed="${sel===c.key}">
      <span class="ic">${icon(c.icon)}</span>
      <span><span class="lab">${c.label}</span><br><span class="sub">${c.sub}</span></span>
    </button>`).join('');
  el.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{ sel=b.dataset.k; renderChips(); renderResult(); scrollToResult(); });
}

function fmtDate(s){
  const [y,m,d] = s.split('-').map(Number);
  const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1];
  return mo+' '+d+', '+y;
}
function renderResult(){
  const el = document.getElementById('result');
  const rawCat = CATS.find(c=>c.key===sel);
  if(!rawCat){ el.innerHTML='<div class="empty">Tap a category to see your best card.</div>'; return; }
  const cat = withQuarter(rawCat);
  const q = currentQuarter();
  let notes = cat.notes.slice();
  if(q && q.ffBonus[cat.key]){
    const cap = ffCap(q), left = Math.max(0, cap - ffSpent(q));
    notes = [ ffCapHit(q)
      ? 'Freedom Flex '+money(cap)+' bonus cap reached this quarter — shown at its base rate. Bonus resets '+fmtDate(q.end)+'.'
      : 'Freedom Flex '+fmt(q.ffBonus[cat.key])+'% bonus this quarter — activate it. '+money(left)+' of the '+money(cap)+' combined cap left; expires '+fmtDate(q.end)+'.'
    ].concat(notes);
  } else if(rawCat.rotating){
    notes = ['Not a Freedom Flex bonus this quarter — shown at its non-bonus rate. Re-check chase.com/freedomflex.'].concat(notes);
  }
  const rows = ranking(cat), w = rows[0], ties = rows.filter(r=>r.tie);
  // Freedom Flex bonus tracker: inside the card when Freedom Flex wins a bonus
  // category; below it when the cap is hit (so the total can still be corrected).
  const isBonusCat = !!(q && q.ffBonus[rawCat.key]);
  const trkIn = isBonusCat && w.key==='ff';
  const trkBelow = isBonusCat && !trkIn && ffCapHit(q);
  const runners = rows.slice(1).filter(r=>!r.tie).map(r=>`
    <div class="runner">
      <div class="stripe" style="background:${CARDS[r.key].band}"></div>
      <div style="flex:1"><div style="font-size:14px;font-weight:600">${CARDS[r.key].short}</div>
      <div style="font-size:11px;color:#6f6d82">${CARDS[r.key].issuer}</div></div>
      <div class="mono" style="font-size:17px;color:#b7b5c4">${fmt(r.rate)}%</div>
    </div>`).join('');
  el.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="card">
        <div class="glow"></div>
        <div style="position:relative;display:flex;justify-content:space-between;align-items:flex-start">
          <div>
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
              ${ICON_IMG[w.key] ? `<img class="cimg" src="${ICON_IMG[w.key]}" alt="${CARDS[w.key].short}">` : `<div class="cfallback" style="background:${CARDS[w.key].band}">${CARDS[w.key].mark ? `<span style="font-weight:700;font-size:15px;letter-spacing:.5px">${CARDS[w.key].mark}</span>` : icon('target')}</div>`}
              <span class="mono" style="font-size:11px;letter-spacing:2px;color:#9c9ab0">${CARDS[w.key].issuer}</span>
              ${ties.length>1?'<span style="font-size:11px;color:#E8B04B;font-weight:600">· TIE</span>':''}
            </div>
            <div style="font-size:20px;font-weight:700;letter-spacing:-.3px;line-height:1.15;max-width:230px">${CARDS[w.key].name}</div>
          </div>
          <div style="text-align:right">
            <div class="mono" style="font-size:40px;font-weight:700;color:#E8B04B;line-height:1">${fmt(w.rate)}<span style="font-size:20px">%</span></div>
            <div style="font-size:11px;color:#8b8aa0;margin-top:4px">effective back</div>
          </div>
        </div>
        ${ties.length>1?`<div class="note" style="position:relative;margin-top:12px;color:#c9b892">Also ties: ${ties.slice(1).map(t=>CARDS[t.key].short).join(', ')} — pick by protections/points.</div>`:''}
        ${trkIn?'<div id="tracker" data-in="1"></div>':''}
      </div>
      ${trkBelow?'<div id="tracker"></div>':''}
      <div style="display:flex;flex-direction:column;gap:7px">${runners}</div>
      <div class="notebox">${notes.map(n=>`<div class="note" style="display:flex;gap:8px"><span style="color:#E8B04B">›</span><span>${n}</span></div>`).join('')}</div>
    </div>`;
  renderTracker();
}

function scrollToResult(){
  const el = document.getElementById('result');
  if(!el) return;
  const smooth = !window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  requestAnimationFrame(()=>{ el.scrollIntoView({ behavior: smooth?'smooth':'auto', block:'nearest' }); });
}
function renderChrome(){
  const q = currentQuarter();
  const eb = document.getElementById('eyebrow');
  const warn = document.getElementById('warn');
  const foot = document.getElementById('foot');
  if(q){
    eb.textContent = q.label.toUpperCase();
    warn.innerHTML = '';
    foot.innerHTML = 'Freedom Flex '+q.label+' bonus: '+q.blurb+' — through '+fmtDate(q.end)+'. Re-check the quarterly categories before relying on them next quarter.<br>On mobile: Share → Add to Home Screen to keep this one tap away.';
  } else {
    eb.textContent = 'CATEGORIES NEED UPDATE';
    warn.innerHTML = '<div class="warn"><span style="font-weight:700;color:#E8B04B">!</span><span><b>Freedom Flex categories aren’t set for today ('+fmtDate(todayStr())+').</b> The rotating 5% bonuses are hidden and shown at their base rate until this quarter is added. Verify at chase.com/freedomflex and update the QUARTERS list in the code.</span></div>';
    foot.innerHTML = 'On mobile: Share → Add to Home Screen to keep this one tap away.';
  }
}
function renderTracker(){
  const el = document.getElementById('tracker');
  const q = currentQuarter();
  if(!el || !q) return;
  const cap = ffCap(q), spent = ffSpent(q), pct = Math.min(100, spent / cap * 100);
  const hit = spent >= cap, fromFeed = !!(feedSpend && feedSpend[q.id]!==undefined);
  const color = hit ? '#6f6d82' : pct >= 85 ? '#E8883B' : '#E8B04B';
  el.innerHTML = `
    <div class="trk${el.dataset.in?' in-card':''}">
      <div class="trk-top">
        <span class="trk-lab">${el.dataset.in?"QUARTERLY BONUS":"FREEDOM FLEX BONUS"} · ${q.id.slice(4)} ${q.id.slice(0,4)}</span>
        <span class="mono trk-amt">${money(spent)} <span style="color:#6f6d82;font-weight:400">/ ${money(cap)}</span></span>
      </div>
      <div class="trk-bar" role="progressbar" aria-valuemin="0" aria-valuemax="${cap}" aria-valuenow="${Math.round(spent)}">
        <div class="trk-fill" style="width:${pct}%;background:${color}"></div>
      </div>
      <div class="note">${hit ? 'Cap reached — bonus categories now shown at base rate.' : money(cap - spent)+' left at the bonus rate · ends '+fmtDate(q.end)}${fromFeed ? ' · from feed'+(feedUpdated?' ('+feedUpdated+')':'') : ''}</div>
      ${fromFeed ? '' : `
      <div class="trk-row">
        <input class="in" id="trkAmt" type="number" inputmode="decimal" step="0.01" min="0" placeholder="${trkEditing?'New total':'Amount'}">
        <button class="set" id="trkGo">${trkEditing?'Set total':'Add'}</button>
        <button class="trk-link" id="trkMode">${trkEditing?'Cancel':'Edit total'}</button>
      </div>`}
    </div>`;
  if(fromFeed) return;
  const inp = document.getElementById('trkAmt');
  const go = () => {
    const v = parseFloat(inp.value);
    if(isNaN(v) || v < 0) return;
    SPEND[q.id] = Math.round((trkEditing ? v : spent + v) * 100) / 100;
    trkEditing = false; saveSpend(); renderResult();
  };
  document.getElementById('trkGo').onclick = go;
  inp.onkeydown = e => { if(e.key==='Enter') go(); };
  document.getElementById('trkMode').onclick = () => { trkEditing = !trkEditing; renderTracker(); };
}
function renderAll(){ renderChrome(); renderSettings(); renderChips(); renderResult(); }
document.getElementById('setBtn').onclick=()=>{ showSettings=!showSettings; renderSettings(); };
renderAll();
loadSpendFeed();

// Register the service worker. On each launch it checks for a new version;
// when one is found it activates and reloads once so the shortcut self-updates.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            window.location.reload();
          }
        });
      });
    }).catch(() => {});
  });
}
</script>
